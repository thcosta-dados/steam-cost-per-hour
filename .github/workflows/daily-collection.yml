# Daily collection: runs the pipeline (collection + catalog) against Supabase every day.
# A failed run (including a partial one) marks the run red and GitHub e-mails the repository owner.
name: Daily collection

on:
  schedule:
    # 06:17 UTC = 03:17 in Brasília. GitHub often starts scheduled runs hours late (observed
    # between 08:04 and 12:58 in Brasília from 23 Oct to 5 Nov 2026); scheduling early keeps the run on
    # the same day even so. Minute 17 stays away from the top of the hour, when GitHub's queue is busiest.
    - cron: "17 6 * * *"
  workflow_dispatch: # "Run workflow" button for manual runs

permissions:
  contents: read # least privilege for GITHUB_TOKEN: the job only checks out the code

concurrency: # never two runs at once (e.g. scheduled + manual); the second one waits in the queue
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python 3.12 (same version as the Docker environment)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the daily pipeline
        run: python -m src.run_daily
        env:
          # Sensitive values come from the repository secrets (never written here)
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USERS: ${{ secrets.STEAM_USERS }}
          STEAM_ID_HASH_KEY: ${{ secrets.STEAM_ID_HASH_KEY }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Not secret: Supabase session pooler port, database name and required encryption
          POSTGRES_PORT: "5432"
          POSTGRES_DB: postgres
          # TLS with the server certificate checked against Supabase's root CA (versioned in tunnel/)
          POSTGRES_SSLMODE: verify-full
          PGSSLROOTCERT: ${{ github.workspace }}/tunnel/supabase-root-ca-2021.crt
