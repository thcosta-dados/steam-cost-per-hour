; Tunnel used by Power BI to read Supabase.
; Power BI's PostgreSQL connector only trusts the Windows certificate store, and Supabase signs its
; database certificates with its own root CA. Instead of adding that CA to Windows, the trust stays here:
; - Power BI -> tunnel: plain PostgreSQL, only inside this computer (port bound to 127.0.0.1 in docker-compose.yml)
; - tunnel -> Supabase: encrypted, and the server must prove it is the Supabase pooler

foreground = yes
pid =

[supabase]
client = yes
accept = 0.0.0.0:5432
connect = aws-1-sa-east-1.pooler.supabase.com:5432
; PostgreSQL asks for encryption inside its own protocol (SSLRequest) before the TLS handshake
protocol = pgsql
; The certificate chain must lead to Supabase's root CA, and the name must match the pooler
verifyChain = yes
CAfile = /etc/stunnel/supabase-root-ca-2021.crt
checkHost = aws-1-sa-east-1.pooler.supabase.com
